services:
  postgres:
    image: postgres:16-alpine
    container_name: chitthi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chitthi
      POSTGRES_USER: chitthi
      POSTGRES_PASSWORD: chitthi
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chitthi -d chitthi"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: chitthi-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: chitthi
      RABBITMQ_DEFAULT_PASS: chitthi
      RABBITMQ_ERLANG_COOKIE: "CHITTHI_COOKIE_SECRET_2026"
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: chitthi-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: quay.io/minio/mc:RELEASE.2024-09-16T17-43-44Z
    container_name: chitthi-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/chitthi-documents;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
